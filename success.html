<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Survey Success</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #0b1a0f;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* Container */
    .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        animation: fadeIn 1.5s ease-in-out;
    }

    /* Tick bounce animation */
    .tick {
        font-size: 110px;
        color: #1dbf32;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 10px rgba(0,255,0,0.4));
        animation: bounce 1.3s ease-out;
    }

    @keyframes bounce {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); }
    }

    /* Text animation */
    h2 {
        font-size: 30px;
        margin-bottom: 10px;
        color: #adffad;
        animation: slideDown 1.2s ease-out;
    }

    @keyframes slideDown {
        0% { transform: translateY(-30px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }

    p {
        font-size: 18px;
        opacity: 0.85;
        margin-bottom: 25px;
        animation: fadeIn 2s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Button */
    #goSpin {
        background: #1dbf32;
        padding: 14px 34px;
        border-radius: 12px;
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(0,255,0,0.25);
        transition: 0.2s;
        animation: fadeIn 2.5s ease-out;
    }

    #goSpin:hover {
        background: #18a52b;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0,255,0,0.4);
    }

    /* Bottom image */
    .bottom-image {
        width: 100%;
        height: auto;
    }
</style>
</head>

<body>

<div class="content">
    <div class="tick">✓</div>

    <h2>Congratulations!</h2>
    <p>You have passed the survey successfully.</p>

    <a href="spin.html" id="goSpin">Proceed to Spin</a>
</div>

<!-- Your image placed at bottom -->
<img src="images/safaricom2.jpg" class="bottom-image">


</body>
</html>

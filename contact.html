<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us - Shangwe Promotion</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    background: #e8f5e9;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
}

.container {
    background: #fff;
    max-width: 450px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

h2 {
    color: #00a651;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #bbb;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #00a651;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #008f45;
}
</style>
</head>

<body>
<div class="container">
    <h2>Contact Us</h2>
    <p>We are here to help you regarding the Shangwe Reward Program.</p>

    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <textarea placeholder="Your message..." rows="5"></textarea>

    <button>Send Message</button>
</div>
</body>
</html>
